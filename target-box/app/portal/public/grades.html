/* =========================
   RESET
========================= */

/* =========================

body {

    margin: auto;

    display: flex;

.brand {

    align-items: center;

}


.logo {

}

    font-weight: bold;

}


.brand-subtitle {

    margin-top: 3px;

}


.logout {

    background: transparent;

    border: 1px solid white;

    color: white;

    padding: 7px 12px;

    border-radius: 5px;

    cursor: pointer;

}


.logout:hover {

    background: rgba(255,255,255,0.15);

}


/* =========================
   NAV
========================= */

.nav {

    background: white;

    border-bottom: 1px solid #ddd;

}


.nav-inner {

    max-width: 1100px;

    margin: auto;

    display: flex;

    justify-content: center;

}


.nav a {

    padding: 17px 25px;

    text-decoration: none;

    color: #333;

}


.nav a:hover,

    color: #9b761f;

    font-weight: bold;

}


/* =========================
   MAIN
========================= */

    width: min(950px, 92%);

    margin: auto;

    padding-bottom: 50px;

}


.title {

    text-align: center;

    color: #594b2d;

    font-size: 24px;

}


.title::after {

    width: 45px;

    height: 3px;

    margin: 10px auto;

}


/* =========================
   GPA
========================= */

.gpa {

    background: #f5ecd7;

    border-radius: 8px;

    text-align: center;

    padding: 25px;

    margin-bottom: 20px;

}


.gpa-number {

    font-size: 40px;

    color: #8b6c2c;

    font-weight: bold;

}


.gpa-label {

    color: #806f4c;

    font-size: 12px;

}


/* =========================
   SEMESTER LABEL
========================= */

.semester-label {

    display: inline-block;

    background: #b58d32;

    color: white;

    padding: 8px 15px;

    border-radius: 5px;

    font-size: 13px;

    font-weight: bold;

    margin-bottom: 20px;

}


/* =========================
   CARD
========================= */

.card {

    background: white;

    border: 1px solid #e5e0d5;

    border-radius: 8px;

    padding: 22px;

    margin-bottom: 20px;

}


.card-title {

    color: #594b2d;

    margin-bottom: 8px;

}


.card-subtitle {

    color: #999;

    font-size: 12px;

    margin-bottom: 20px;

}


/* =========================
   TABLE
========================= */

.table-wrapper {

    overflow-x: auto;

}


table {

    width: 100%;

    border-collapse: collapse;

}


th {

    background: #f5f1e8;

    color: #705c2d;

    padding: 13px;

    font-size: 12px;

    text-align: left;

}


td {

    padding: 14px 13px;

    border-bottom: 1px solid #eee;

    font-size: 13px;

}


tbody tr:hover {

    background: #faf8f2;

}


/* =========================
   SCORE
========================= */

.score-pass {

    color: #5d825e;

    font-weight: bold;

}


.score-fail {

    color: #b65f5f;

    font-weight: bold;

}


/* =========================
   EMPTY
========================= */

.empty {

    text-align: center;

    padding: 35px;

    color: #999;

    font-size: 13px;

/* =========================
   FOOTER
========================= */

footer {

    background: #4c4538;

    color: white;

    text-align: center;

}


footer p {

    color: #d5d0c7;

/* =========================

========================= */

        overflow-x: auto;

        justify-content: flex-start;

    .nav a {

        white-space: nowrap;

        padding: 14px 18px;

    }

}

<script src="api.js"></script>


<script>

/* =========================================================
   登入
========================================================= */

const user = requireLogin();



/* =========================================================
   登出
========================================================= */

function logout() {

    localStorage.removeItem("loginUser");

    window.location.href = "login.html";

}



/* =========================================================
   上學期課程資料
=========================================================

   目前是前端測試資料。

   這些課程刻意和 enrollment.html
   的網路選課課程不同。

========================================================= */

const previousSemesterCourses = [

    {
        id: 101,
        name: "作業系統",
        teacher: "張老師",
        credits: 3,
        semester: "2025-2",
        score: 88
    },


    {
        id: 102,
        name: "計算機網路",
        teacher: "林老師",
        credits: 3,
        semester: "2025-2",
        score: 82
    },


    {
        id: 103,
        name: "資料結構",
        teacher: "陳老師",
        credits: 3,
        semester: "2025-2",
        score: 91
    },


    {
        id: 104,
        name: "離散數學",
        teacher: "黃老師",
        credits: 3,
        semester: "2025-2",
        score: 76
    },


    {
        id: 105,
        name: "軟體工程",
        teacher: "吳老師",
        credits: 3,
        semester: "2025-2",
        score: 85
    }

];



/* =========================================================
   HTML 防護
========================================================= */

function escapeHTML(text) {

    return String(text ?? "")

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}



/* =========================================================
   GPA 計算
========================================================= */

function weightedGpa(courses) {

    const scored =
        courses.filter(function(course) {

            return (

                course.score !== null &&

                course.score !== undefined &&

                course.score !== ""

            );

        });


    if (scored.length === 0) {

        return null;

    }


    const totalCredits =
        scored.reduce(function(sum, course) {

            return (
                sum +
                Number(course.credits || 0)
            );

        }, 0);


    const totalPoints =
        scored.reduce(function(sum, course) {

            return (

                sum +

                scoreToGpaPoint(
                    course.score
                ) *

                Number(
                    course.credits || 0
                )

            );

        }, 0);


    if (totalCredits === 0) {

        return null;

    }


    return totalPoints / totalCredits;

}



/* =========================================================
   成績顯示
========================================================= */

function renderScore(score) {

    if (
        score === null ||
        score === undefined ||
        score === ""
    ) {

        return "—";

    }


    if (Number(score) >= 60) {

        return `

            <span class="score-pass">

                ${escapeHTML(score)}

            </span>

        `;

    }


    return `

        <span class="score-fail">

            ${escapeHTML(score)}

        </span>

    `;

}



/* =========================================================
   載入上學期成績
========================================================= */

function loadPreviousSemesterGrades() {


    const gradesBody =
        document.getElementById(
            "gradesBody"
        );


    const summaryBody =
        document.getElementById(
            "semesterSummaryBody"
        );



    /* =========================
       GPA
    ========================= */

    const gpa =
        weightedGpa(
            previousSemesterCourses
        );


    document.getElementById(
        "gpaNumber"
    ).textContent =

        gpa === null
            ? "—"
            : gpa.toFixed(2);



    /* =========================
       課程列表
    ========================= */

    if (
        previousSemesterCourses.length === 0
    ) {

        gradesBody.innerHTML = `

            <tr>

                <td
                    colspan="5"
                    class="empty">

                    上學期目前沒有成績資料

                </td>

            </tr>

        `;

    }

    else {

        gradesBody.innerHTML =

            previousSemesterCourses.map(
                function(course) {

                    return `

                        <tr>

                            <td>

                                ${escapeHTML(
                                    course.name
                                )}

                            </td>


                            <td>

                                ${escapeHTML(
                                    course.teacher
                                )}

                            </td>


                            <td>

                                ${escapeHTML(
                                    course.credits
                                )}

                            </td>


                            <td>

                                ${renderScore(
                                    course.score
                                )}

                            </td>


                            <td>

                                ${escapeHTML(
                                    scoreToLetter(
                                        course.score
                                    )
                                )}

                            </td>

                        </tr>

                    `;

                }
            ).join("");

    }



    /* =========================
       總修課學分
    ========================= */

    const totalCredits =
        previousSemesterCourses.reduce(
            function(sum, course) {

                return (

                    sum +

                    Number(
                        course.credits || 0
                    )

                );

            },
            0
        );



    /* =========================
       各學期統計
    ========================= */

    summaryBody.innerHTML = `

        <tr>

            <td>
                2025-2・上學期
            </td>


            <td>
                ${totalCredits}
            </td>


            <td>

                ${
                    gpa === null
                        ? "—"
                        : gpa.toFixed(2)
                }

            </td>


            <td>
                ${totalCredits}
            </td>

        </tr>

    `;

}



/* =========================================================
   啟動
========================================================= */

loadPreviousSemesterGrades();

</script>
