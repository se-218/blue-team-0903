<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>個人資訊｜Campus Portal</title>

<style>

/* =========================
   RESET
========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


/* =========================
   BODY
========================= */

body {

    font-family:
        "Noto Sans TC",
        "Microsoft JhengHei",
        Arial,
        sans-serif;

    background: #f5f3ee;

    color: #333;

}


/* =========================
   HEADER
========================= */

.top {

    background: #d9ae45;

    color: white;

    padding: 20px 25px;

}

.top-inner {

    max-width: 1100px;

    margin: auto;

    display: flex;

    justify-content: space-between;

    align-items: center;

}

.brand {

    display: flex;

    align-items: center;

    gap: 15px;

}

.logo {

    width: 58px;

    height: 58px;

    border: 2px solid white;

    border-radius: 50%;

    display: flex;

    justify-content: center;

    align-items: center;

    font-weight: bold;

    font-size: 20px;

}

.brand-title {

    font-size: 25px;

    font-weight: bold;

}

.brand-subtitle {

    font-size: 12px;

    margin-top: 3px;

}

.logout {

    background: transparent;

    border: 1px solid white;

    color: white;

    padding: 7px 12px;

    border-radius: 5px;

    cursor: pointer;

}

.logout:hover {

    background: rgba(255,255,255,0.15);

}


/* =========================
   NAV
========================= */

.nav {

    background: white;

    border-bottom: 1px solid #ddd;

}

.nav-inner {

    max-width: 1100px;

    margin: auto;

    display: flex;

    justify-content: center;

}

.nav a {

    padding: 17px 25px;

    text-decoration: none;

    color: #333;

}

.nav a:hover,
.nav a.active {

    background: #f3ead3;

    color: #9b761f;

    font-weight: bold;

}


/* =========================
   MAIN
========================= */

.container {

    width: min(950px, 92%);

    margin: auto;

    padding-bottom: 60px;

}

.title {

    text-align: center;

    color: #594b2d;

    font-size: 24px;

    margin: 35px 0 25px;

}

.title::after {

    content: "";

    display: block;

    width: 45px;

    height: 3px;

    background: #d9ae45;

    margin: 10px auto;

}


/* =========================
   PROFILE CARD
========================= */

.profile-card {

    background: white;

    border: 1px solid #e5e0d5;

    border-radius: 8px;

    padding: 30px;

    margin-bottom: 20px;

}


/* =========================
   PROFILE HEADER
========================= */

.profile-header {

    display: flex;

    align-items: center;

    gap: 20px;

    padding-bottom: 25px;

    border-bottom: 1px solid #eee;

}

.avatar {

    width: 80px;

    height: 80px;

    border-radius: 50%;

    background: #eee4c9;

    border: 3px solid #d9ae45;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #705c2d;

    font-size: 30px;

    font-weight: bold;

    flex-shrink: 0;

}

.profile-header-text {

    flex: 1;

}

.profile-header-text h2 {

    color: #594b2d;

    font-size: 21px;

    margin-bottom: 6px;

}

.profile-header-text p {

    color: #999;

    font-size: 12px;

}


/* =========================
   INFO GRID
========================= */

.info-grid {

    display: grid;

    grid-template-columns: repeat(2, 1fr);

    gap: 18px 25px;

    margin-top: 25px;

}

.info-item {

    background: #faf9f5;

    border: 1px solid #eee8db;

    border-radius: 6px;

    padding: 15px;

}

.label {

    font-size: 11px;

    color: #999;

    margin-bottom: 8px;

}

.value {

    font-size: 14px;

    color: #333;

    min-height: 21px;

    font-weight: 600;

}


/* =========================
   INPUT
========================= */

.input {

    display: none;

    width: 100%;

    height: 38px;

    border: 1px solid #d8cdb8;

    border-radius: 5px;

    padding: 0 10px;

    font-size: 13px;

    outline: none;

    background: white;

}

.input:focus {

    border-color: #b58d32;

}


/* =========================
   BUTTON
========================= */

.button-area {

    margin-top: 25px;

    display: flex;

    justify-content: flex-end;

    align-items: center;

    gap: 8px;

}

.button {

    border: none;

    border-radius: 5px;

    padding: 9px 17px;

    cursor: pointer;

    font-size: 13px;

}

.edit-button {

    background: #b58d32;

    color: white;

}

.edit-button:hover {

    background: #957327;

}

.cancel-button {

    display: none;

    background: #ddd;

    color: #555;

}

.cancel-button:hover {

    background: #ccc;

}

.save-area {

    display: none;

}

.save-button {

    background: #5d825e;

    color: white;

}

.save-button:hover {

    background: #496b4c;

}

.save-button:disabled {

    opacity: 0.6;

    cursor: not-allowed;

}


/* =========================
   NOTICE
========================= */

.notice {

    margin-top: 20px;

    padding: 12px 15px;

    background: #faf7ef;

    border-left: 4px solid #d9ae45;

    color: #776b52;

    font-size: 12px;

    line-height: 1.7;

}


/* =========================
   MESSAGE
========================= */

.message {

    display: none;

    margin-top: 18px;

    padding: 12px;

    border-radius: 5px;

    background: #e9f5eb;

    color: #397146;

    font-size: 12px;

    text-align: center;

}


/* =========================
   SECURITY
========================= */

.security-card {

    background: white;

    border: 1px solid #e5e0d5;

    border-radius: 8px;

    padding: 25px;

}

.security-title {

    font-size: 17px;

    color: #594b2d;

    font-weight: bold;

    margin-bottom: 18px;

}

.security-item {

    display: flex;

    justify-content: space-between;

    padding: 14px 0;

    border-bottom: 1px solid #eee;

    font-size: 13px;

}

.security-item:last-child {

    border-bottom: none;

}

.security-label {

    color: #777;

}

.security-value {

    color: #555;

}


/* =========================
   FOOTER
========================= */

footer {

    background: #4c4538;

    color: white;

    text-align: center;

    padding: 30px;

}

footer p {

    color: #d5d0c7;

    font-size: 11px;

    margin-top: 5px;

}


/* =========================
   MOBILE
========================= */

@media(max-width:700px) {

    .top-inner {

        flex-direction: column;

        gap: 15px;

    }

    .nav-inner {

        overflow-x: auto;

        justify-content: flex-start;

    }

    .nav a {

        white-space: nowrap;

        padding: 14px 18px;

    }

    .info-grid {

        grid-template-columns: 1fr;

    }

    .profile-card {

        padding: 20px;

    }

    .profile-header {

        align-items: flex-start;

    }

    .button-area {

        justify-content: flex-start;

        flex-wrap: wrap;

    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="top">

    <div class="top-inner">

        <div class="brand">

            <div class="logo">
                CP
            </div>

            <div>

                <div class="brand-title">
                    校園資訊服務平台
                </div>

                <div class="brand-subtitle">
                    CAMPUS INFORMATION PORTAL
                </div>

            </div>

        </div>


        <button
            class="logout"
            onclick="logout()">

            登出

        </button>

    </div>

</header>


<!-- =========================
     NAV
========================= -->

<nav class="nav">

    <div class="nav-inner">

        <a href="index.html">
            首頁
        </a>

        <a href="courses.html">
            我的課程
        </a>

        <a href="enrollment.html">
            網路選課
        </a>

        <a href="grades.html">
            成績查詢
        </a>

        <a
            href="profile.html"
            class="active">

            個人資訊

        </a>

    </div>

</nav>


<!-- =========================
     MAIN
========================= -->

<main class="container">


    <h1 class="title">
        個人資訊
    </h1>


    <!-- =========================
         PROFILE
    ========================= -->

    <div class="profile-card">


        <!-- HEADER -->

        <div class="profile-header">

            <div
                class="avatar"
                id="avatar">

                同

            </div>


            <div class="profile-header-text">

                <h2 id="displayName">
                    載入中...
                </h2>

                <p>
                    學生個人資料
                </p>

            </div>

        </div>


        <!-- =========================
             INFO
        ========================= -->

        <div class="info-grid">


            <!-- 姓名 -->

            <div class="info-item">

                <div class="label">
                    姓名
                </div>

                <div
                    class="value"
                    id="nameText">

                    載入中...

                </div>

                <input
                    id="nameInput"
                    class="input"
                    type="text"
                    maxlength="50"
                    placeholder="請輸入姓名">

            </div>


            <!-- 學號 -->

            <div class="info-item">

                <div class="label">
                    學號
                </div>

                <div
                    class="value"
                    id="studentNoText">

                    載入中...

                </div>

            </div>


            <!-- 系所 -->

            <div class="info-item">

                <div class="label">
                    系所
                </div>

                <div
                    class="value"
                    id="departmentText">

                    載入中...

                </div>

                <input
                    id="departmentInput"
                    class="input"
                    type="text"
                    maxlength="100"
                    placeholder="請輸入系所">

            </div>


            <!-- 年級 -->

            <div class="info-item">

                <div class="label">
                    年級
                </div>

                <div
                    class="value"
                    id="gradeText">

                    尚未設定

                </div>

                <input
                    id="gradeInput"
                    class="input"
                    type="text"
                    maxlength="20"
                    placeholder="例如：三年級">

            </div>


            <!-- Email -->

            <div class="info-item">

                <div class="label">
                    Email
                </div>

                <div
                    class="value"
                    id="emailText">

                    尚未設定

                </div>

                <input
                    id="emailInput"
                    class="input"
                    type="email"
                    maxlength="100"
                    placeholder="例如：student@example.com">

            </div>


            <!-- 聯絡電話 -->

            <div class="info-item">

                <div class="label">
                    聯絡電話
                </div>

                <div
                    class="value"
                    id="phoneText">

                    尚未設定

                </div>

                <input
                    id="phoneInput"
                    class="input"
                    type="text"
                    inputmode="numeric"
                    maxlength="10"
                    placeholder="請輸入10位數字">

            </div>


        </div>


        <!-- =========================
             NOTICE
        ========================= -->

        <div class="notice">


        </div>


        <!-- =========================
             BUTTON
        ========================= -->

        <div class="button-area">


            <button
                id="editButton"
                class="button edit-button"
                onclick="startEdit()">

                編輯資料

            </button>


            <button
                id="cancelButton"
                class="button cancel-button"
                onclick="cancelEdit()">

                取消

            </button>


            <div
                id="saveArea"
                class="save-area">

                <button
                    id="saveButton"
                    class="button save-button"
                    onclick="saveProfile()">

                    儲存變更

                </button>

            </div>

        </div>


        <!-- =========================
             MESSAGE
        ========================= -->

        <div
            id="message"
            class="message">

            ✓ 個人資料已成功更新

        </div>


    </div>


    <!-- =========================
         SECURITY
    ========================= -->

    <div class="security-card">

        <div class="security-title">
            帳號安全
        </div>


        <div class="security-item">

            <span class="security-label">
                帳號狀態
            </span>

            <span class="security-value">
                正常
            </span>

        </div>


        <div class="security-item">

            <span class="security-label">
                學號
            </span>

            <span
                class="security-value"
                id="studentIdHeader">

                載入中...

            </span>

        </div>


        <div class="security-item">

            <span class="security-label">
                密碼
            </span>

            <span class="security-value">
                ●●●●●●●●
            </span>

        </div>

    </div>


</main>


<!-- =========================
     FOOTER
========================= -->

<footer>

    <h3>
        Campus Portal
    </h3>

    <p>
        校園資訊服務平台
    </p>

    <p>
        © 2026 Campus Information System
    </p>

</footer>


<script src="api.js"></script>

<script>

/* =========================================================
   LOGIN
========================================================= */

const user = requireLogin();


/* =========================================================
   PROFILE
========================================================= */

let profile = null;


/* =========================================================
   LOCAL STORAGE
========================================================= */

/*
 * 目前年級與 Email 尚未確定資料庫欄位。
 *
 * 所以這兩個先保留在 localStorage，
 * 等之後改 DB 再改成 API。
 *
 * 注意：
 * 班級、入學年度完全沒有在這裡。
 */

const PROFILE_LOCAL_KEY =
    "campusProfileExtras";


function loadLocalExtras() {

    try {

        return JSON.parse(
            localStorage.getItem(
                PROFILE_LOCAL_KEY
            )
        ) || {};

    } catch (error) {

        return {};

    }

}


function saveLocalExtras(data) {

    localStorage.setItem(
        PROFILE_LOCAL_KEY,
        JSON.stringify(data)
    );

}


/* =========================================================
   載入個人資料
========================================================= */

async function loadProfile() {

    try {

        /*
         * 從 student-api 取得真正資料
         */

        const data =
            await apiFetch(
                `/student/${user.id}`
            );


        profile = data;


        /*
         * 年級 / Email
         *
         * 如果目前 API 還沒有這兩個欄位，
         * 就暫時從 localStorage 補。
         */

        const extras =
            loadLocalExtras();


        if (
            profile.grade === undefined ||
            profile.grade === null
        ) {

            profile.grade =
                extras.grade || "";

        }


        if (
            profile.email === undefined ||
            profile.email === null
        ) {

            profile.email =
                extras.email || "";

        }


        displayProfile();


    } catch (error) {

        console.error(
            "載入個人資料失敗:",
            error
        );


        alert(
            "無法載入個人資料：" +
            error.message
        );

    }

}


/* =========================================================
   顯示個人資料
========================================================= */

function displayProfile() {

    if (!profile) {
        return;
    }


    const name =
        profile.name || "尚未設定";


    const studentNo =
        profile.student_no || "—";


    const department =
        profile.department || "尚未設定";


    const grade =
        profile.grade || "尚未設定";


    const email =
        profile.email || "尚未設定";


    const phone =
        profile.phone || "尚未設定";


    /*
     * 姓名
     */

    document.getElementById(
        "nameText"
    ).textContent =
        name;


    document.getElementById(
        "displayName"
    ).textContent =
        name;


    /*
     * 學號
     */

    document.getElementById(
        "studentNoText"
    ).textContent =
        studentNo;


    document.getElementById(
        "studentIdHeader"
    ).textContent =
        studentNo;


    /*
     * 系所
     */

    document.getElementById(
        "departmentText"
    ).textContent =
        department;


    /*
     * 年級
     */

    document.getElementById(
        "gradeText"
    ).textContent =
        grade;


    /*
     * Email
     */

    document.getElementById(
        "emailText"
    ).textContent =
        email;


    /*
     * 電話
     */

    document.getElementById(
        "phoneText"
    ).textContent =
        phone;


    /*
     * 頭像
     */

    document.getElementById(
        "avatar"
    ).textContent =
        name.charAt(0);


    /*
     * 編輯欄位
     */

    document.getElementById(
        "nameInput"
    ).value =
        profile.name || "";


    document.getElementById(
        "departmentInput"
    ).value =
        profile.department || "";


    document.getElementById(
        "gradeInput"
    ).value =
        profile.grade || "";


    document.getElementById(
        "emailInput"
    ).value =
        profile.email || "";


    document.getElementById(
        "phoneInput"
    ).value =
        profile.phone || "";

}


/* =========================================================
   開始編輯
========================================================= */

function startEdit() {


    document
        .querySelectorAll(".value")
        .forEach(function(element) {

            element.style.display =
                "none";

        });


    document
        .querySelectorAll(".input")
        .forEach(function(element) {

            element.style.display =
                "block";

        });


    document.getElementById(
        "editButton"
    ).style.display =
        "none";


    document.getElementById(
        "cancelButton"
    ).style.display =
        "inline-block";


    document.getElementById(
        "saveArea"
    ).style.display =
        "block";

}


/* =========================================================
   取消編輯
========================================================= */

function cancelEdit() {

    displayProfile();


    document
        .querySelectorAll(".value")
        .forEach(function(element) {

            element.style.display =
                "block";

        });


    document
        .querySelectorAll(".input")
        .forEach(function(element) {

            element.style.display =
                "none";

        });


    document.getElementById(
        "editButton"
    ).style.display =
        "inline-block";


    document.getElementById(
        "cancelButton"
    ).style.display =
        "none";


    document.getElementById(
        "saveArea"
    ).style.display =
        "none";

}


/* =========================================================
   儲存個人資料
========================================================= */

async function saveProfile() {


    const name =
        document.getElementById(
            "nameInput"
        ).value.trim();


    const department =
        document.getElementById(
            "departmentInput"
        ).value.trim();


    const grade =
        document.getElementById(
            "gradeInput"
        ).value.trim();


    const email =
        document.getElementById(
            "emailInput"
        ).value.trim();


    const phone =
        document.getElementById(
            "phoneInput"
        ).value.trim();


    /* =========================
       姓名
    ========================= */

    if (!name) {

        alert(
            "姓名不能為空"
        );

        return;

    }


    /* =========================
       Email
    ========================= */

    if (
        email &&
        !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)
    ) {

        alert(
            "Email 格式不正確"
        );

        return;

    }


    /* =========================
       電話
    ========================= */

    if (
        phone &&
        !/^[0-9]{10}$/.test(phone)
    ) {

        alert(
            "聯絡電話必須為10位數字"
        );

        return;

    }


    const saveButton =
        document.getElementById(
            "saveButton"
        );


    saveButton.disabled = true;


    try {


        /* =================================================
           DB 欄位

           目前送：
           name
           department
           phone

           後端之後再正式加入：
           grade
           email
        ================================================= */

        const updated =
            await apiFetch(
                `/student/${user.id}`,
                {

                    method: "PUT",

                    body: JSON.stringify({

                        name:
                            name,

                        department:
                            department,

                        phone:
                            phone

                    })

                }
            );


        /*
         * API 更新成功
         */

        profile = {

            ...profile,

            ...updated,

            name:
                updated.name ??
                name,

            department:
                updated.department ??
                department,

            phone:
                updated.phone ??
                phone,

            grade:
                grade,

            email:
                email

        };


        /*
         * 暫時保存尚未接 DB 的兩個欄位
         *
         * 注意：
         * 只有 grade / email
         *
         * 沒有 class
         * 沒有 admission_year
         */

        saveLocalExtras({

            grade:
                grade,

            email:
                email

        });


        displayProfile();


        cancelEdit();


        /*
         * 成功訊息
         */

        const message =
            document.getElementById(
                "message"
            );


        message.style.display =
            "block";


        setTimeout(
            function() {

                message.style.display =
                    "none";

            },
            3000
        );


    } catch (error) {

        console.error(
            "儲存個人資料失敗:",
            error
        );


        alert(
            "儲存失敗：" +
            error.message
        );

    }


    saveButton.disabled = false;

}


/* =========================================================
   登出
========================================================= */

function logout() {

    localStorage.removeItem(
        "loginUser"
    );


    window.location.href =
        "login.html";

}


/* =========================================================
   啟動
========================================================= */

loadProfile();

</script>


</body>

</html>
