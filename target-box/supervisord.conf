[program:mysqld]
command=/usr/sbin/mysqld --user=mysql
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/mysqld.log
stderr_logfile=/var/log/supervisor/mysqld.log

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx.log

[program:portal]
directory=/opt/portal
command=node src/index.js
environment=PORT="3000"
user=www-data
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/portal.log
stderr_logfile=/var/log/supervisor/portal.log

[program:course-api]
directory=/opt/course-api
command=node src/index.js
environment=PORT="3001",MYSQL_HOST="127.0.0.1",MYSQL_PORT="3306",MYSQL_USER="campus",MYSQL_PASSWORD="campus",MYSQL_DATABASE="campus_db"
user=www-data
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/course-api.log
stderr_logfile=/var/log/supervisor/course-api.log

[program:student-api]
directory=/opt/student-api
command=node src/index.js
environment=PORT="3002",MYSQL_HOST="127.0.0.1",MYSQL_PORT="3306",MYSQL_USER="campus",MYSQL_PASSWORD="campus",MYSQL_DATABASE="campus_db",JWT_SECRET="campus-dev-jwt-secret-change-me"
user=www-data
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/student-api.log
stderr_logfile=/var/log/supervisor/student-api.log

[program:sshd]
command=/usr/sbin/sshd -D
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/sshd.log
stderr_logfile=/var/log/supervisor/sshd.log

[program:php-fpm]
command=/usr/sbin/php-fpm8.5 -F
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/php-fpm.log
stderr_logfile=/var/log/supervisor/php-fpm.log

[program:cron]
command=/usr/sbin/cron -f
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/cron.log
stderr_logfile=/var/log/supervisor/cron.log

# 隱藏關卡7：曝露的 docker socket（honeypot）。以 root 跑，socket 才會是 root:root。
# autorestart=unexpected：正常結束不重啟——藍隊 rm 掉 socket 後就不會被重新拉起而重建。
[program:dind-honeypot]
command=node /opt/honeypot/dind-honeypot.js
autostart=true
autorestart=unexpected
stdout_logfile=/var/log/supervisor/dind-honeypot.log
stderr_logfile=/var/log/supervisor/dind-honeypot.log
